<div id="app"></div>
<style>
  :root{
    --bg:#12201B;
    --surface:#1B2B24;
    --surface-2:#22352C;
    --line:#2E4438;
    --text:#EDEEE7;
    --text-muted:#8FA396;
    --amber:#E8A33D;
    --sage:#8FB996;
    --urgent:#D6584A;
    --font-display:'Fraunces','Georgia',serif;
    --font-body:'Inter',-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;}
  #app{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    padding:28px 20px 60px;
    min-height:100%;
    border-radius:14px;
  }
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:18px;}
  .header h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0 0 4px;letter-spacing:.2px;}
  .header .clock{font-family:var(--font-mono);color:var(--amber);font-size:13px;}
  .header .sub{color:var(--text-muted);font-size:13px;margin-top:2px;}

  .quickadd{display:flex;gap:8px;margin-bottom:24px;}
  .quickadd input{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:8px;font-family:var(--font-body);font-size:14px;}
  .quickadd input:focus{outline:none;border-color:var(--amber);}
  .quickadd button{background:var(--amber);color:#1B2B24;border:none;padding:0 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;}
  .quickadd button:hover{filter:brightness(1.08);}

  .io-btn{background:var(--surface-2);border:1px solid var(--line);color:var(--sage);padding:7px 12px;border-radius:8px;font-size:12px;font-family:var(--font-mono);cursor:pointer;white-space:nowrap;}
  .io-btn:hover{border-color:var(--sage);}

  .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-bottom:18px;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 8px;}
  .card h2{font-family:var(--font-display);font-weight:600;font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .card h2 .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);background:var(--surface-2);padding:2px 7px;border-radius:20px;border:1px solid var(--line);}

  .empty{color:var(--text-muted);font-size:13px;padding:14px 0;font-style:italic;}

  .tonight-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .tonight-item:last-child{border-bottom:none;}
  .tonight-item input[type=checkbox]{margin-top:3px;accent-color:var(--amber);width:16px;height:16px;cursor:pointer;flex-shrink:0;}
  .tonight-item .txt{flex:1;}
  .tonight-item .txt.done{text-decoration:line-through;color:var(--text-muted);}
  .tonight-item .meta{font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px;}
  .refresh-btn{background:none;border:1px solid var(--line);color:var(--text-muted);font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;font-family:var(--font-mono);}
  .refresh-btn:hover{border-color:var(--amber);color:var(--amber);}

  .deadline-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .deadline-row:last-child{border-bottom:none;}
  .deadline-row .name{flex:1;padding-right:10px;}
  .deadline-row .days{font-family:var(--font-mono);font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .days.soon{background:rgba(214,88,74,.18);color:var(--urgent);}
  .days.mid{background:rgba(232,163,61,.18);color:var(--amber);}
  .days.far{background:rgba(143,185,150,.15);color:var(--sage);}

  .cantieri{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
  @media (max-width:900px){.cantieri{grid-template-columns:1fr;}}
  .cant-col h3{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:0 0 10px;display:flex;justify-content:space-between;}
  .task{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:13px;}
  .task .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .task .name{flex:1;}
  .task .name.done{text-decoration:line-through;color:var(--text-muted);}
  .prio{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .prio.Alta{background:var(--urgent);}
  .prio.Media{background:var(--amber);}
  .prio.Bassa{background:var(--sage);}
  .task .actions{display:flex;gap:6px;margin-top:6px;}
  .task .actions button{background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;font-family:var(--font-mono);padding:0;}
  .task .actions button:hover{color:var(--amber);}

  .email-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px;}
  .email-row:last-child{border-bottom:none;}
  .email-row .who{font-weight:600;}
  .email-row .ctx{color:var(--text-muted);font-size:12px;}
  .email-row .when{font-family:var(--font-mono);font-size:11px;color:var(--amber);white-space:nowrap;}
  .email-row button{background:none;border:1px solid var(--line);color:var(--text-muted);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;font-family:var(--font-mono);}
  .email-row button:hover{border-color:var(--sage);color:var(--sage);}

  .loading{color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  const CANTIERI = ["Raccolta fondi","Biomasse","Visibilità"];
  const today = new Date(); today.setHours(0,0,0,0);

  const seedTasks = [
    {id:"t1",cantiere:"Raccolta fondi",text:"Verificare iscrizione startup innovativa",priorita:"Alta",scadenza:"2026-07-03",stato:"Da iniziare",tonight:true,azione:"",note:""},
    {id:"t2",cantiere:"Raccolta fondi",text:"Fissare appuntamento in banca (Fondo Garanzia PMI)",priorita:"Media",scadenza:"2026-07-06",stato:"Da iniziare",tonight:false,azione:"",note:""},
    {id:"t3",cantiere:"Raccolta fondi",text:"Avviare business plan / piano economico-finanziario",priorita:"Alta",scadenza:"2026-07-13",stato:"Da iniziare",tonight:true,azione:"",note:""},
    {id:"t4",cantiere:"Biomasse",text:"Preparare lista 12-15 birrifici + 6-8 oleifici",priorita:"Alta",scadenza:"2026-07-06",stato:"Da iniziare",tonight:true,azione:"",note:""},
    {id:"t5",cantiere:"Biomasse",text:"Scrivere email icebreaker per fornitori",priorita:"Media",scadenza:"2026-07-06",stato:"Da iniziare",tonight:false,azione:"",note:""},
    {id:"t6",cantiere:"Visibilità",text:"Aggiornare sito e LinkedIn",priorita:"Bassa",scadenza:"2026-07-06",stato:"Da iniziare",tonight:false,azione:"",note:""},
    {id:"t7",cantiere:"Visibilità",text:"Iscriversi update Ecomondo / Making Cosmetics",priorita:"Bassa",scadenza:"2026-07-06",stato:"Da iniziare",tonight:false,azione:"",note:""},
  ];
  const seedDeadlines = [
    {id:"d1",name:"Firma accordo PoliMi + sblocco 1ª tranche",data:"2026-09-07",cantiere:"Raccolta fondi",stato:"Da fare",note:""},
    {id:"d2",name:"Domanda Smart&Start",data:"2026-09-14",cantiere:"Raccolta fondi",stato:"Da fare",note:""},
    {id:"d3",name:"ECOMONDO — Rimini",data:"2026-11-03",cantiere:"Visibilità",stato:"Da fare",note:""},
    {id:"d4",name:"MAKING COSMETICS — Milano",data:"2026-11-25",cantiere:"Visibilità",stato:"Da fare",note:""},
    {id:"d5",name:"GATE MS1 GO/NO-GO",data:"2026-12-14",cantiere:"Progetto",stato:"Da fare",note:""},
  ];
  const seedEmails = [
    {id:"e1",who:"PoliMi — referente scientifico",ctx:"Sollecito proposta economica",cantiere:"Progetto",stato:"Da inviare",next:"2026-07-03",note:""},
    {id:"e2",who:"Birrifici",ctx:"Icebreaker + richiesta scheda tecnica BSG",cantiere:"Biomasse",stato:"Da scrivere",next:"2026-07-06",note:""},
    {id:"e3",who:"Banca",ctx:"Richiesta appuntamento Fondo Garanzia PMI",cantiere:"Raccolta fondi",stato:"Da inviare",next:"2026-07-03",note:""},
  ];
  let lastImport = null;

  let tasks=[], deadlines=[], emails=[], loaded=false;
  const uid = () => 't'+Date.now()+Math.floor(Math.random()*1000);

  async function loadAll(){
    try{
      const t = await window.storage.get('tasks', false);
      tasks = t ? JSON.parse(t.value) : seedTasks;
    }catch(e){ tasks = seedTasks; }
    try{
      const d = await window.storage.get('deadlines', false);
      deadlines = d ? JSON.parse(d.value) : seedDeadlines;
    }catch(e){ deadlines = seedDeadlines; }
    try{
      const em = await window.storage.get('emails', false);
      emails = em ? JSON.parse(em.value) : seedEmails;
    }catch(e){ emails = seedEmails; }
    try{
      const li = await window.storage.get('lastImport', false);
      lastImport = li ? li.value : null;
    }catch(e){ lastImport = null; }
    loaded = true;
    render();
  }
  async function saveTasks(){ try{ await window.storage.set('tasks', JSON.stringify(tasks), false); }catch(e){} }
  async function saveDeadlines(){ try{ await window.storage.set('deadlines', JSON.stringify(deadlines), false); }catch(e){} }
  async function saveEmails(){ try{ await window.storage.set('emails', JSON.stringify(emails), false); }catch(e){} }
  async function saveLastImport(){ try{ await window.storage.set('lastImport', lastImport, false); }catch(e){} }

  // ---------- IMPORT DA EXCEL ----------
  function sheetToRows(wb, name){
    const ws = wb.Sheets[name];
    if(!ws) return null;
    return XLSX.utils.sheet_to_json(ws, {defval:""});
  }
  function asDateStr(v){
    if(v instanceof Date) return v.toISOString().slice(0,10);
    if(typeof v === 'number'){
      const d = XLSX.SSF.parse_date_code(v);
      if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    }
    return (v||'').toString().trim();
  }
  function handleImportFile(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});

        const taskRows = sheetToRows(wb, 'Task');
        if(taskRows){
          tasks = taskRows.filter(r=>r['Attività']).map((r,i)=>({
            id: 'imp-t'+i,
            cantiere: r['Cantiere']||'Altro',
            text: r['Attività']||'',
            priorita: r['Priorità']||'Media',
            scadenza: asDateStr(r['Scadenza']),
            stato: r['Stato']||'Da iniziare',
            tonight: false,
            azione: r['Prossima azione concreta']||'',
            note: r['Note']||''
          }));
        }
        const deadRows = sheetToRows(wb, 'Scadenze chiave');
        if(deadRows){
          deadlines = deadRows.filter(r=>r['Milestone / Evento']).map((r,i)=>({
            id: 'imp-d'+i,
            name: r['Milestone / Evento']||'',
            data: asDateStr(r['Data']),
            cantiere: r['Cantiere']||'',
            stato: r['Stato']||'Da fare',
            note: r['Note']||''
          }));
        }
        const emailRows = sheetToRows(wb, 'Email');
        if(emailRows){
          emails = emailRows.filter(r=>r['Destinatario'] && (r['Stato']||'') !== 'Chiusa').map((r,i)=>({
            id: 'imp-e'+i,
            who: r['Destinatario']||'',
            ctx: r['Oggetto / contesto']||'',
            cantiere: r['Cantiere']||'',
            stato: r['Stato']||'Da inviare',
            next: asDateStr(r['Prossimo controllo']) || new Date().toISOString().slice(0,10),
            note: r['Note']||''
          }));
        }
        lastImport = new Date().toLocaleString('it-IT');
        saveTasks(); saveDeadlines(); saveEmails(); saveLastImport();
        render();
      }catch(err){
        alert('Non sono riuscito a leggere il file. Controlla che sia il file "BioPhi_Sistema_di_Gestione.xlsx" con i fogli Task, Scadenze chiave, Email.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- EXPORT VERSO EXCEL ----------
  function exportToExcel(){
    const wb = XLSX.utils.book_new();
    const taskRows = tasks.map(t=>({
      'Cantiere': t.cantiere, 'Attività': t.text, 'Priorità': t.priorita,
      'Scadenza': t.scadenza, 'Stato': t.stato,
      'Prossima azione concreta': t.azione||'', 'Note': t.note||''
    }));
    const deadRows = deadlines.map(d=>({
      'Data': d.data, 'Milestone / Evento': d.name, 'Cantiere': d.cantiere||'',
      'Stato': d.stato||'Da fare', 'Note': d.note||''
    }));
    const emailRows = emails.map(e=>({
      'Destinatario': e.who, 'Oggetto / contesto': e.ctx, 'Cantiere': e.cantiere||'',
      'Stato': e.stato||'Da inviare', 'Data invio': '', 'Prossimo controllo': e.next, 'Note': e.note||''
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(taskRows), 'Task');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(deadRows), 'Scadenze chiave');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(emailRows), 'Email');
    XLSX.writeFile(wb, 'BioPhi_Dashboard_Export_'+new Date().toISOString().slice(0,10)+'.xlsx');
  }

  function daysUntil(dateStr){
    const d = new Date(dateStr); d.setHours(0,0,0,0);
    return Math.round((d-today)/86400000);
  }
  function fmtDate(dateStr){
    const d = new Date(dateStr);
    return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function pickTonight(){
    const open = tasks.filter(t=>t.stato!=='Fatto');
    const marked = open.filter(t=>t.tonight);
    if(marked.length) return marked.slice(0,5);
    const order = {Alta:0,Media:1,Bassa:2};
    return [...open].sort((a,b)=> (order[a.priorita]??3)-(order[b.priorita]??3) || new Date(a.scadenza)-new Date(b.scadenza)).slice(0,3);
  }

  function toggleDone(id){
    const t = tasks.find(x=>x.id===id);
    if(t){ t.stato = t.stato==='Fatto' ? 'Da iniziare' : 'Fatto'; saveTasks(); render(); }
  }
  function toggleTonight(id){
    const t = tasks.find(x=>x.id===id);
    if(t){ t.tonight = !t.tonight; saveTasks(); render(); }
  }
  function addQuick(text){
    if(!text.trim()) return;
    tasks.unshift({id:uid(),cantiere:"Altro",text:text.trim(),priorita:"Media",scadenza:new Date().toISOString().slice(0,10),stato:"Da iniziare",tonight:true});
    saveTasks(); render();
  }
  function snoozeEmail(id){
    const e = emails.find(x=>x.id===id);
    if(e){
      const d = new Date(); d.setDate(d.getDate()+3);
      e.next = d.toISOString().slice(0,10);
      saveEmails(); render();
    }
  }
  function doneEmail(id){
    emails = emails.filter(x=>x.id!==id);
    saveEmails(); render();
  }

  function render(){
    const app = document.getElementById('app');
    if(!loaded){ app.innerHTML = '<div class="loading">Carico il tuo cruscotto…</div>'; return; }

    const tonight = pickTonight();
    const openTasksByCantiere = c => tasks.filter(t=>t.cantiere===c && t.stato!=='Fatto');
    const sortedDeadlines = [...deadlines].sort((a,b)=>new Date(a.data)-new Date(b.data)).slice(0,6);
    const sortedEmails = [...emails].sort((a,b)=>new Date(a.next)-new Date(b.next));

    const now = new Date();
    const isEvening = now.getHours() >= 18 || now.getHours() < 6;

    app.innerHTML = `
      <div class="header">
        <div>
          <h1>BioPhi — Centrale Operativa</h1>
          <div class="sub">${isEvening ? 'Sessione serale — scegli poche cose, falle bene' : 'Vista rapida dei tre cantieri'}${lastImport ? ' · ultimo import: '+lastImport : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="clock">${now.toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'long'})}</div>
          <label class="io-btn" for="import-input">Importa da Excel</label>
          <input id="import-input" type="file" accept=".xlsx" style="display:none;"/>
          <button class="io-btn" id="export-btn">Esporta Excel</button>
        </div>
      </div>

      <div class="quickadd">
        <input id="qa-input" type="text" placeholder="Aggiungi al volo qualcosa da non dimenticare… (invio per salvare)"/>
        <button id="qa-btn">Aggiungi</button>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Stasera <span class="tag">max 3 cose</span></h2>
          ${tonight.length ? tonight.map(t=>`
            <div class="tonight-item">
              <input type="checkbox" ${t.stato==='Fatto'?'checked':''} data-toggle="${t.id}"/>
              <div class="txt">
                <div class="${t.stato==='Fatto'?'done':''}">${escapeHtml(t.text)}</div>
                <div class="meta">${t.cantiere} · scad. ${fmtDate(t.scadenza)}</div>
              </div>
            </div>`).join('') : '<div class="empty">Niente in coda. Aggiungi qualcosa qui sopra.</div>'}
        </div>

        <div class="card">
          <h2>Scadenze imminenti</h2>
          ${sortedDeadlines.map(d=>{
            const days = daysUntil(d.data);
            const cls = days<=14 ? 'soon' : days<=45 ? 'mid' : 'far';
            const label = days<0 ? 'passata' : days===0 ? 'oggi' : `tra ${days}g`;
            return `<div class="deadline-row"><div class="name">${escapeHtml(d.name)}</div><div class="days ${cls}">${label}</div></div>`;
          }).join('')}
        </div>
      </div>

      <div class="cantieri">
        ${CANTIERI.map(c=>{
          const items = openTasksByCantiere(c);
          return `<div class="cant-col">
            <h3>${c} <span>${items.length}</span></h3>
            ${items.length ? items.map(t=>`
              <div class="task">
                <div class="top">
                  <span class="prio ${t.priorita}"></span>
                  <span class="name">${escapeHtml(t.text)}</span>
                </div>
                <div class="actions">
                  <button data-toggle="${t.id}">${t.stato==='Fatto'?'riapri':'fatto'}</button>
                  <button data-tonight="${t.id}">${t.tonight?'✓ stasera':'metti stasera'}</button>
                </div>
              </div>`).join('') : '<div class="empty">Tutto fatto qui.</div>'}
          </div>`;
        }).join('')}
      </div>

      <div class="card">
        <h2>Email in sospeso</h2>
        ${sortedEmails.length ? sortedEmails.map(e=>{
          const days = daysUntil(e.next);
          const urgent = days<=0;
          return `<div class="email-row">
            <div style="flex:1">
              <div class="who">${escapeHtml(e.who)}</div>
              <div class="ctx">${escapeHtml(e.ctx)}</div>
            </div>
            <div class="when" style="${urgent?'color:var(--urgent)':''}">${days<=0?'da fare oggi':'tra '+days+'g'}</div>
            <button data-snooze="${e.id}">+3g</button>
            <button data-doneemail="${e.id}">fatta</button>
          </div>`;
        }).join('') : '<div class="empty">Nessun follow-up in sospeso.</div>'}
      </div>
    `;

    document.getElementById('import-input').onchange = (ev) => {
      const file = ev.target.files[0];
      if(file) handleImportFile(file);
    };
    document.getElementById('export-btn').onclick = exportToExcel;

    document.getElementById('qa-btn').onclick = () => {
      const inp = document.getElementById('qa-input');
      addQuick(inp.value); inp.value='';
    };
    document.getElementById('qa-input').addEventListener('keydown', ev=>{
      if(ev.key==='Enter'){ addQuick(ev.target.value); ev.target.value=''; }
    });
    app.querySelectorAll('[data-toggle]').forEach(el=> el.onclick = () => toggleDone(el.getAttribute('data-toggle')));
    app.querySelectorAll('[data-tonight]').forEach(el=> el.onclick = () => toggleTonight(el.getAttribute('data-tonight')));
    app.querySelectorAll('[data-snooze]').forEach(el=> el.onclick = () => snoozeEmail(el.getAttribute('data-snooze')));
    app.querySelectorAll('[data-doneemail]').forEach(el=> el.onclick = () => doneEmail(el.getAttribute('data-doneemail')));
  }

  loadAll();
})();
</script>
