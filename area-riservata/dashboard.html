<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Centrale Operativa · BioPhi S.r.l.</title>

  <link rel="icon" href="/images/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="assets/area-riservata.css">

  <!-- SheetJS: import/export Excel (già usato dalla dashboard originale) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="ar-body">

  <!-- Mostrato finché la guardia non conferma l'autenticazione -->
  <div id="ar-gate" class="ar-gate">Verifico l'accesso…</div>

  <!-- Rivelato solo a utente autenticato -->
  <div id="ar-shell" hidden>
    <header class="ar-topbar">
      <a href="../index.html" class="ar-topbar-logo">BioPhi<span>srl</span></a>
      <div class="ar-topbar-right">
        <span id="ar-user" class="ar-user"></span>
        <button id="logout-btn" class="ar-btn ar-btn--ghost" type="button">Esci</button>
      </div>
    </header>
    <nav class="ar-views" aria-label="Viste">
      <a href="#operativa">Operativa</a>
      <a href="#calendario">Calendario</a>
      <a href="#gantt">Gantt</a>
    </nav>
    <main>
      <div id="app"></div>
    </main>
  </div>

  <!-- Modale modifica / nuovo task -->
  <dialog id="task-dialog" class="ar-dialog">
    <form id="task-form" method="dialog">
      <h3 id="task-dialog-title">Modifica task</h3>

      <label>Attività
        <input name="text" type="text" required autocomplete="off">
      </label>

      <div class="dlg-row">
        <label>Cantiere
          <select name="cantiere">
            <option>Raccolta fondi</option>
            <option>Biomasse</option>
            <option>Visibilità</option>
          </select>
        </label>
        <label>Tipo
          <select name="tipo">
            <option value="iniziativa">iniziativa</option>
            <option value="routine">routine</option>
          </select>
        </label>
      </div>

      <div class="dlg-row">
        <label>Priorità
          <select name="priorita"><option>Alta</option><option>Media</option><option>Bassa</option></select>
        </label>
        <label>Inizio (per il Gantt)
          <input name="inizio" type="date">
        </label>
      </div>

      <div class="dlg-row">
        <label>Scadenza
          <input name="scadenza" type="date">
        </label>
        <label>Stato
          <select name="stato"></select>
        </label>
      </div>

      <div class="dlg-row">
        <label>Assegnatario
          <select name="assignee"></select>
        </label>
        <label>Vincolo collegato (scadenza)
          <select name="linkedDeadlineId"></select>
        </label>
      </div>

      <label>Prossima azione concreta
        <input name="azione" type="text" autocomplete="off">
      </label>

      <label>Note
        <textarea name="note" rows="2"></textarea>
      </label>

      <div class="dlg-actions">
        <button type="button" id="task-delete" class="ar-btn ar-btn--ghost danger">Elimina</button>
        <span class="spacer"></span>
        <button type="button" id="task-cancel" class="ar-btn ar-btn--ghost">Annulla</button>
        <button type="submit" class="ar-btn">Salva</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
